# Default: free temporary demo. SQLite and generated key reset on restart/redeploy.
# The 512 MiB free instance may be too small for PyTorch. Not a verified free-hosting promise.
services:
  - type: web
    name: crop-disease-detection
    runtime: docker
    branch: feature/crop-detection-foundation
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
